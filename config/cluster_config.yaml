# Multi-GPU Cluster APPO Training Configuration
# For 2x A100 or H100 GPUs via torchrun

# Environment settings (same as base)
environment:
  env_id: MultiCarRacing-v0
  num_agents: 1
  direction: CCW
  use_random_direction: false
  backwards_flag: true
  h_ratio: 0.25
  use_ego_color: false
  render_mode: null

# PPO hyperparameters — tuned for larger batch throughput
ppo:
  learning_rate: 3.0e-4
  n_steps: 128          # Short rollouts for low-latency queue feeding
  batch_size: 512       # Larger mini-batch for GPU efficiency
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.05
  vf_coef: 0.25
  max_grad_norm: 0.5
  min_log_std: -1.0
  max_log_std: 0.5
  steer_min_log_std: -0.5
  steer_max_log_std: 0.0

policy:
  policy_type: CnnPolicy

# Training settings — scaled for cluster
training:
  trainer_backend: torch
  total_timesteps: 2000000
  eval_freq: 5000
  n_eval_episodes: 5
  save_freq: 25000
  log_interval: 5
  num_envs: 32         # Total across all GPUs (16 per GPU on 2x GPU)
  fail_fast:
    enabled: true
    min_timesteps_before_check: 50000
    min_mean_progress: 0.05
    min_mean_speed: 1.0
    patience_evals: 5
  visual_eval:
    enabled: false      # Disable on headless cluster
    freq: 50000
    n_episodes: 1
  success_gate:
    enabled: true
    mean_reward_threshold: 150.0
    mean_progress_threshold: 0.95
    max_offtrack_rate: 0.10
    min_eval_episodes: 5

# APPO-specific settings
appo:
  num_workers: 32       # Total actor workers (split across GPUs)
  n_steps: 128          # Steps per trajectory per worker
  target_batch: 8       # Trajectories batched per learner update
  max_staleness: 5      # Max policy versions behind before drop
  queue_size: 64        # Trajectory queue maxsize

paths:
  model_dir: ./models/cluster_appo
  log_dir: ./logs/cluster_appo
  results_dir: ./results/cluster_appo

device: cuda

reward_shaping:
  enabled: true
  use_custom_reward: true
  forward_progress_scale: 600.0
  track_alignment_scale: 0.0
  straight_speed_scale: 0.0
  sharp_turn_threshold: 0.35
  sharp_turn_lookahead: 6
  corner_target_speed: 8.0
  corner_overspeed_penalty_scale: 0.0
  apex_decel_reward_scale: 0.0
  apex_decel_reward_cap: 1.0
  steer_smoothness_penalty: 0.0
  steer_delta_cap: 0.5
  steer_magnitude_penalty: 0.0
  lateral_velocity_penalty: 0.0
  time_penalty: -0.1
  idle_speed_threshold: 1.0
  idle_penalty: -0.3
  throttle_bonus_scale: 0.0
  brake_penalty_scale: 0.0
  launch_boost_steps: 0
  launch_speed_target: 5.0
  launch_bonus_scale: 0.0
  stuck_speed_threshold: 0.8
  stuck_progress_epsilon: 0.001
  stuck_max_steps: 200
  stuck_terminal_penalty: -20.0
  no_progress_max_steps: 500
  no_progress_terminal_penalty: -10.0
  yaw_rate_penalty: 0.05
  off_track_mode: penalty
  off_track_terminal_penalty: -50.0
  off_track_step_penalty: 0.0
  curriculum:
    enabled: false

observation:
  enabled: false

safety_governor:
  enabled: true
  speed_cap_ratio: 0.5
  speed_cap_top_speed: 60.0
  speed_cap_brake: 0.4
