  visual_eval:
    enabled: false
    freq: 200000
    n_episodes: 1
  success_gate:
    enabled: true
    mean_reward_threshold: 150.0
    mean_progress_threshold: 0.6
    max_offtrack_rate: 0.35
    min_eval_episodes: 3
  torch_policy_variant_source: /Users/epablo/Documents/UPenn/SophmoreSpring26/STAT4830/WedApr1_Work/Racing_Gym_RL/autoresearch/results/research_branches/v4_autoresearch_gpt4omini_20260405_172106/generation_001/01_baseline_continuation/candidate_surface.py
paths:
