environment:
  env_id: MultiCarRacing-v0
  max_episode_steps: 2000
  num_agents: 2
  direction: CCW
  use_random_direction: false
  backwards_flag: true
  h_ratio: 0.25
  use_ego_color: false
  render_mode: null
ppo:
  learning_rate: 0.00025
  n_steps: 1024
  batch_size: 1536
  n_epochs: 3
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.05
  vf_coef: 0.25
  max_grad_norm: 0.5
  min_log_std: -0.75
  max_log_std: 0.5
  steer_min_log_std: -0.5
  steer_max_log_std: 0.0
policy:
  policy_type: CnnPolicy
training:
  trainer_backend: torch
  marl_paradigm: shared_policy_ippo
  torch_policy_variant: marl_surface_baseline
  total_timesteps: 4000000
  eval_freq: 50000
  eval_subprocess: true
  n_eval_episodes: 3
  save_freq: 100000
  log_interval: 5
  num_envs: 1
  fail_fast:
    enabled: true
    min_timesteps_before_check: 100000
    min_mean_progress: 0.05
    min_mean_speed: 1.0
